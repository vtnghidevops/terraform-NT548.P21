version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
    - echo "Installing cfn-lint and taskcat..."
    - pip install cfn-lint taskcat

  pre_build:
    commands:
    - echo "Validating CloudFormation template..."
    - cfn-lint cloudformation.yml

  build:
    commands:
    - echo "Running taskcat tests..."
    - ls -la
    - taskcat test run
    - mkdir -p ~/.aws
    - echo "[default]" > ~/.aws/config
    - echo "region = us-east-1" >> ~/.aws/config
    - echo "output = json" >> ~/.aws/config

  post_build:
    commands:
    - echo "CloudFormation template validation and taskcat tests completed on `date`"

artifacts:
  files:
  - cloudformation.yml
  - parameters.json
  - README.md
  - buildspec.yml
  - taskcat.yml
  discard-paths: no
