AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for CodePipeline to deploy CloudFormation templates'

Parameters:
  CodeCommitRepositoryName:
    Type: String
    Default: cloudformation-lab2-group8-repo

  CodeCommitBranchName:
    Type: String
    Default: main

  CloudFormationStackName:
    Type: String
    Default: cloudformation-lab2-group8

Resources:
  # S3 bucket for storing artifacts
  ArtifactBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      VersioningConfiguration:
        Status: Enabled
    DeletionPolicy: Delete

  # IAM roles with restricted policies
  CodeBuildServiceRolePolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      Description: Policy for CodeBuild service role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - 'logs:CreateLogGroup'
          - 'logs:CreateLogStream'
          - 'logs:PutLogEvents'
          Resource: '*'
        - Effect: Allow
          Action:
          - 's3:GetObject'
          - 's3:GetObjectVersion'
          - 's3:PutObject'
          - 's3:CreateBucket'
          - 's3:PutBucketPolicy'
          - 's3:PutBucketVersioning'
          - 's3:PutLifecycleConfiguration'
          - 's3:ListBucket'
          Resource:
          - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
          - 'arn:aws:s3:::tcat-*'
          - !Sub 'arn:aws:s3:::tcat-*/*'
        - Effect: Allow
          Action:
          - 'cloudformation:ValidateTemplate'
          - 'cloudformation:CreateStack'
          - 'cloudformation:DeleteStack'
          - 'cloudformation:DescribeStacks'
          - 'cloudformation:UpdateStack'
          - 'cloudformation:CreateChangeSet'
          - 'cloudformation:DeleteChangeSet'
          - 'cloudformation:DescribeChangeSet'
          - 'cloudformation:ExecuteChangeSet'
          - 'cloudformation:SetStackPolicy'
          Resource: '*'
        - Effect: Allow
          Action:
          - 'ec2:DescribeAvailabilityZones'
          - 'ec2:DescribeVpcs'
          - 'ec2:DescribeSubnets'
          - 'ec2:DescribeSecurityGroups'
          - 'ec2:DescribeInstances'
          Resource: '*'

  CodePipelineServiceRolePolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      Description: Policy for CodePipeline service role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - 's3:GetObject'
          - 's3:GetObjectVersion'
          - 's3:PutObject'
          - 's3:GetBucketVersioning'
          Resource:
          - !Sub 'arn:aws:s3:::${ArtifactBucket}'
          - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
        - Effect: Allow
          Action:
          - 'codebuild:StartBuild'
          - 'codebuild:BatchGetBuilds'
          Resource: !GetAtt CodeBuildProject.Arn
        - Effect: Allow
          Action:
          - 'cloudformation:CreateStack'
          - 'cloudformation:DeleteStack'
          - 'cloudformation:DescribeStacks'
          - 'cloudformation:UpdateStack'
          - 'cloudformation:CreateChangeSet'
          - 'cloudformation:DeleteChangeSet'
          - 'cloudformation:DescribeChangeSet'
          - 'cloudformation:ExecuteChangeSet'
          - 'cloudformation:SetStackPolicy'
          - 'cloudformation:ValidateTemplate'
          - 'iam:PassRole'
          Resource: '*'
        - Effect: Allow
          Action:
          - 'codecommit:GetBranch'
          - 'codecommit:GetCommit'
          - 'codecommit:UploadArchive'
          - 'codecommit:GetUploadArchiveStatus'
          - 'codecommit:CancelUploadArchive'
          Resource: !Sub 'arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${CodeCommitRepositoryName}'

  CodeBuildServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: codebuild.amazonaws.com
          Action: 'sts:AssumeRole'
      ManagedPolicyArns:
      - !Ref CodeBuildServiceRolePolicy

  CodePipelineServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: codepipeline.amazonaws.com
          Action: 'sts:AssumeRole'
      ManagedPolicyArns:
      - !Ref CodePipelineServiceRolePolicy

  # CloudFormation execution role with limited permissions
  CloudFormationExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudformation.amazonaws.com
          Action: 'sts:AssumeRole'
      ManagedPolicyArns:
      - 'arn:aws:iam::aws:policy/AmazonVPCFullAccess'
      - 'arn:aws:iam::aws:policy/AmazonEC2FullAccess'

  # CodeBuild project
  CodeBuildProject:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Name: !Sub '${CodeCommitRepositoryName}-build'
      Description: 'Build project for CloudFormation templates'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:3.0
        PrivilegedMode: false
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      TimeoutInMinutes: 10

  # CodePipeline
  Pipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      Name: !Sub '${CodeCommitRepositoryName}-pipeline'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
      # Source Stage - Get code from CodeCommit
      - Name: Source
        Actions:
        - Name: Source
          ActionTypeId:
            Category: Source
            Owner: AWS
            Provider: CodeCommit
            Version: '1'
          Configuration:
            RepositoryName: !Ref CodeCommitRepositoryName
            BranchName: !Ref CodeCommitBranchName
          OutputArtifacts:
          - Name: SourceCode

      # Build Stage - Validate CloudFormation templates
      - Name: Build
        Actions:
        - Name: ValidateTemplates
          ActionTypeId:
            Category: Build
            Owner: AWS
            Provider: CodeBuild
            Version: '1'
          Configuration:
            ProjectName: !Ref CodeBuildProject
          InputArtifacts:
          - Name: SourceCode
          OutputArtifacts:
          - Name: BuildOutput

      # Deploy Stage - Deploy CloudFormation stack
      - Name: Deploy
        Actions:
        - Name: CreateOrUpdateStack
          ActionTypeId:
            Category: Deploy
            Owner: AWS
            Provider: CloudFormation
            Version: '1'
          Configuration:
            ActionMode: CREATE_UPDATE
            StackName: !Ref CloudFormationStackName
            TemplatePath: BuildOutput::cloudformation.yml
            TemplateConfiguration: BuildOutput::parameters.json
            RoleArn: !GetAtt CloudFormationExecutionRole.Arn
            Capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND
          InputArtifacts:
          - Name: BuildOutput

Outputs:
  PipelineURL:
    Description: URL to the CodePipeline console
    Value: !Sub https://console.aws.amazon.com/codepipeline/home?region=${AWS::Region}#/view/${Pipeline}

  ArtifactBucketName:
    Description: Name of the S3 bucket used to store build artifacts
    Value: !Ref ArtifactBucket
