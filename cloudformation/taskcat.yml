project:
  name: cloudformation-infrastructure
  regions:
  - us-east-1
  - ap-southeast-1 # Thêm một region nữa để kiểm tra khả năng triển khai đa vùng
  package-lambda: false
  parameters:
    KeyName: 'terraform-lab'

tests:
  infrastructure:
    template: cloudformation.yml
    regions:
    - us-east-1
    parameters:
      Prefix: test-infrastructure
      VpcCidr: 10.0.0.0/16
      PublicSubnetCidr: 10.0.1.0/24
      PrivateSubnetCidr: 10.0.2.0/24
      AllowedIp: 0.0.0.0/0
      InstanceType: t2.micro
